<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Kiến Trúc ESP32 Walkie-Talkie</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Tài liệu kiến trúc chi tiết cho dự án ESP32 ESP-NOW Walkie-Talkie">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #42b983;
            --code-theme-background: #f8f8f8;
        }

        .markdown-section code {
            border-radius: 2px;
            color: #e96900;
            font-size: .8rem;
            margin: 0 2px;
            padding: 3px 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div id="app">Đang tải...</div>
    <script>
        window.$docsify = {
            name: 'ESP32 Walkie-Talkie',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 3,
            auto2top: true,
            search: {
                paths: 'auto',
                placeholder: 'Tìm kiếm...',
                noData: 'Không tìm thấy!',
                depth: 6
            },
            markdown: {
                renderer: {
                    code: function (code, lang) {
                        if (lang === "mermaid") {
                            return '<div class="mermaid">' + code + '</div>';
                        }
                        return this.origin.code.apply(this, arguments);
                    }
                }
            }
        }
    </script>
    <!-- Docsify core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Search plugin -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- Mermaid -->
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: true });
        window.mermaid = mermaid;
    </script>
    <!-- Prism syntax highlighting -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>

</html>
